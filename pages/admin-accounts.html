<!doctype html>
<html lang="id" class="dark scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kelola Akun &amp; Bengkel — Admin KunciGarasi</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              headline: ["Plus Jakarta Sans", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
      }
      ::-webkit-scrollbar {
        display: none;
      }
    </style>
    <link rel="stylesheet" href="/frontend.css" />
    <link rel="stylesheet" href="/brand.css" />
  </head>

  <body
    class="min-h-screen bg-[#0b1326] text-slate-100 flex flex-col font-sans selection:bg-[#4cd7f6]/20 selection:text-[#4cd7f6]"
  >
    <!-- TOP NAVBAR KHUSUS ADMIN -->
    <header
      class="sticky top-0 z-50 bg-[#0b1326]/95 backdrop-blur-xl border-b border-white/10"
    >
      <div
        class="min-h-[64px] w-full max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex items-center justify-between gap-4"
      >
        <div class="flex items-center gap-6 lg:gap-8 min-w-0">
          <a
            href="/dashboard/admin"
            class="flex items-baseline tracking-[-0.04em] select-none shrink-0 focus:outline-none"
          >
            <h1 class="brand-mark !m-0 !text-xl">
              Kunci<span class="brand-mark__suffix">Garasi</span>
            </h1>
          </a>
          <nav
            aria-label="Navigasi dashboard admin"
            class="hidden md:flex items-center gap-5 lg:gap-6 text-xs xl:text-sm whitespace-nowrap"
          >
            <a
              href="/dashboard/admin"
              class="font-medium text-slate-300 hover:text-white transition-colors"
              >Dashboard saya</a
            >
            <a
              href="/admin-accounts.html"
              class="font-semibold text-[#4cd7f6] transition-colors"
              >Kelola akun</a
            >
            <a
              href="/admin-monitoring.html"
              class="font-medium text-slate-300 hover:text-white transition-colors"
              >Log monitoring</a
            >
            <a
              href="/account-settings.html"
              class="font-medium text-slate-300 hover:text-white transition-colors"
              >Pengaturan akun</a
            >
            <a
              href="/help.html"
              class="font-medium text-slate-300 hover:text-white transition-colors"
              >Pusat bantuan</a
            >
          </nav>
        </div>

        <div class="flex items-center gap-3 sm:gap-4 shrink-0">
          <button
            id="refreshAccounts"
            type="button"
            title="Perbarui data"
            class="inline-flex items-center gap-1.5 text-xs font-medium text-slate-300 hover:text-[#4cd7f6] transition-colors whitespace-nowrap cursor-pointer"
          >
            <span class="material-symbols-outlined text-[17px] text-[#4cd7f6]"
              >sync</span
            >
            <span class="hidden sm:inline">Perbarui data</span>
          </button>
          <a
            href="/notifications.html"
            title="Notifikasi"
            aria-label="Notifikasi"
            class="relative p-2 rounded-xl text-slate-300 hover:text-[#4cd7f6] hover:bg-white/5 transition-all flex items-center justify-center"
          >
            <span class="material-symbols-outlined text-[20px]"
              >notifications</span
            >
            <span
              data-notification-dot
              hidden
              aria-hidden="true"
              class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-[#4cd7f6]"
            ></span>
          </a>
          <div
            data-account-profile
            hidden
            class="flex items-center gap-2 pl-3 border-l border-white/10"
          >
            <strong
              data-profile-avatar
              class="w-7 h-7 rounded-full bg-[#1a243b] border border-[#4cd7f6]/40 flex items-center justify-center font-bold text-[#4cd7f6] text-[11px] shrink-0"
              aria-hidden="true"
              >AD</strong
            >
            <div class="hidden lg:flex flex-col text-left">
              <span
                data-profile-email
                class="text-xs font-medium text-slate-200 max-w-[140px] truncate leading-tight"
              ></span>
              <small
                data-profile-role
                class="text-[10px] font-mono text-[#4cd7f6] leading-tight"
              ></small>
            </div>
          </div>
          <button
            type="button"
            data-landing-logout
            title="Keluar"
            aria-label="Keluar"
            class="p-1.5 text-slate-400 hover:text-rose-400 transition-colors cursor-pointer"
          >
            <span class="material-symbols-outlined text-[19px]">logout</span>
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 space-y-6 flex-1 w-full">
      <div
        class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-1"
      >
        <div>
          <h1
            class="text-2xl font-headline font-bold text-white tracking-tight"
          >
            Kelola Akun &amp; Bengkel
          </h1>
          <p class="text-sm text-slate-400 mt-1 max-w-2xl leading-relaxed">
            Detail seluruh akun (pelanggan, mitra, admin) dan seluruh bengkel di
            platform beserta statusnya.
          </p>
        </div>
        <p
          id="accountsStatus"
          role="status"
          class="text-xs font-mono text-[#4cd7f6]"
        ></p>
      </div>

      <section
        class="bg-[#131b2e]/90 backdrop-blur border border-white/10 rounded-3xl p-5 sm:p-6 shadow-xl shadow-black/20 space-y-5"
      >
        <div
          class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 border-b border-white/10 pb-4"
        >
          <div class="flex flex-wrap items-center gap-2">
            <button
              id="tabBtnAccounts"
              type="button"
              data-tab="akun"
              class="tab-btn"
            >
              <span class="material-symbols-outlined text-[17px]">group</span>
              <span>Akun</span>
              <span id="badgeAccounts" class="tab-badge">0</span>
            </button>
            <button
              id="tabBtnWorkshops"
              type="button"
              data-tab="bengkel"
              class="tab-btn"
            >
              <span class="material-symbols-outlined text-[17px]"
                >storefront</span
              >
              <span>Bengkel</span>
              <span id="badgeWorkshops" class="tab-badge">0</span>
            </button>
          </div>

          <div
            class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2.5"
          >
            <input
              id="searchAccounts"
              type="search"
              placeholder="Cari email, nama bengkel, alamat..."
              class="w-full sm:w-72 rounded-xl border border-white/15 bg-[#060e20]/90 px-3.5 py-2 text-xs text-slate-100 placeholder-slate-500 outline-none focus:border-[#4cd7f6] focus:ring-1 focus:ring-[#4cd7f6]"
            />
            <select
              id="filterRole"
              class="rounded-xl border border-white/15 bg-[#060e20]/90 px-3 py-2 text-xs text-slate-100 outline-none focus:border-[#4cd7f6]"
            >
              <option value="all">Semua akun aktif</option>
              <option value="customer">Pelanggan</option>
              <option value="partner">Mitra</option>
              <option value="admin">Admin</option>
              <option value="inactive">Nonaktif</option>
            </select>
            <select
              id="filterStatus"
              class="hidden rounded-xl border border-white/15 bg-[#060e20]/90 px-3 py-2 text-xs text-slate-100 outline-none focus:border-[#4cd7f6]"
            >
              <option value="all">Semua status</option>
              <option value="approved">Disetujui</option>
              <option value="pending">Menunggu</option>
              <option value="rejected">Ditolak</option>
            </select>
          </div>
        </div>

        <div id="panelAccounts" class="grid gap-3.5 md:grid-cols-2"></div>
        <div
          id="panelWorkshops"
          class="grid gap-3.5 md:grid-cols-2 hidden"
        ></div>
      </section>
    </main>

    <footer
      class="w-full border-t border-white/5 py-6 px-4 sm:px-6 bg-[#060e20]/60 mt-auto"
    >
      <div
        class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-400"
      >
        <div class="flex items-center gap-2">
          <span class="font-headline font-semibold text-slate-300"
            >admin<span class="text-[#4cd7f6]">in.</span></span
          >
          <span>—</span>
          <span class="font-mono text-slate-400"
            >Admin Governance &amp; Monitoring</span
          >
        </div>
        <nav class="flex items-center gap-4">
          <a href="/terms.html" class="hover:text-slate-200 transition-colors"
            >Syarat Layanan</a
          >
          <span class="text-white/20">•</span>
          <a href="/privacy.html" class="hover:text-slate-200 transition-colors"
            >Kebijakan Privasi</a
          >
        </nav>
      </div>
    </footer>

    <script src="/app.js"></script>
    <script src="/admin-accounts.js"></script>
    <script src="/notifications.js"></script>
  </body>
</html>
