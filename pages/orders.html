<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pesanan saya — KunciGarasi</title>
    <link rel="stylesheet" href="/frontend.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />

    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        corePlugins: { preflight: false },
        theme: {
          extend: {
            colors: {
              "bengkelin-navy": "#0b1326",
              "bengkelin-dark": "#060e20",
              "bengkelin-card": "#131b2e",
              "bengkelin-card-hover": "#17223b",
              "bengkelin-border": "rgba(255, 255, 255, 0.08)",
              "bengkelin-cyan": "#4cd7f6",
              "bengkelin-blue": "#93ccff",
              "bengkelin-amber": "#ffb95f",
              "bengkelin-muted": "#bfc7d2",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              heading: ["Plus Jakarta Sans", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
          },
        },
      };
    </script>

    <style>
      body {
        background-color: #0b1326;
        color: #bfc7d2;
        font-family: "Inter", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glass-panel {
        background: rgba(19, 27, 46, 0.85);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
      }
    </style>
    <style>
      .orders-navbar a {
        text-decoration: none;
      }
      body > header.orders-navbar {
        max-width: none;
        margin: 0;
        padding: 0;
      }

      body > header.orders-navbar nav {
        display: none;
        gap: 0;
        flex-wrap: nowrap;
      }

      @media (min-width: 768px) {
        body > header.orders-navbar nav {
          display: flex;
        }
      }

      .orders-navbar [data-landing-logout] {
        padding: 0.5rem;
        background: transparent;
      }

      .orders-navbar [data-landing-logout]:hover {
        background: rgb(244 63 94 / 10%);
      }
    </style>
    <link rel="stylesheet" href="/brand.css" />
  </head>
  <body data-feature="orders">
    <header
      class="orders-navbar sticky top-0 z-50 glass-panel border-b border-white/10 bg-[#0b1326]/90 backdrop-blur-md"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between"
      >
        <!-- Brand Logo & Nav Links -->
        <div class="flex items-center gap-8">
          <a class="brand-mark" href="/login.html"
            >Kunci<span class="brand-mark__suffix">Garasi</span></a
          >

          <nav class="hidden md:flex items-center space-x-1">
            <a
              class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-bengkelin-muted hover:text-white hover:bg-white/5 transition-all"
              href="/landing.html"
            >
              Beranda
            </a>
            <a
              class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-bengkelin-muted hover:text-white hover:bg-white/5 transition-all"
              href="/search.html"
            >
              Cari bengkel
            </a>
            <a
              class="px-3.5 py-1.5 rounded-lg text-sm font-semibold text-bengkelin-cyan hover:text-white hover:bg-white/5 transition-all"
              href="/ai.html"
            >
              Konsultasi AI
            </a>
            <a
              class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-bengkelin-muted hover:text-white hover:bg-white/5 transition-all"
              href="/support.html"
            >
              Customer Service
            </a>
            <a
              class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-bengkelin-muted hover:text-white hover:bg-white/5 transition-all"
              href="/help.html"
            >
              Pusat bantuan
            </a>
            <a
              class="px-3.5 py-1.5 rounded-lg text-sm font-medium text-bengkelin-muted hover:text-white hover:bg-white/5 transition-all"
              href="/account-settings.html"
            >
              Pengaturan akun
            </a>
          </nav>
        </div>

        <!-- Tombol Auth & Ikon Kanan -->
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 border-r border-white/10 pr-4">
            <!-- Tombol Keranjang -->
            <a
              href="/orders.html"
              class="p-2 rounded-xl text-on-surface-variant hover:text-secondary hover:bg-surface-container-high transition-all flex items-center justify-center"
              title="Keranjang"
            >
              <span class="material-symbols-outlined text-[24px]"
                >shopping_cart</span
              >
            </a>

            <!-- Tombol Notifikasi -->
            <a
              href="/notifications.html"
              class="relative p-2 rounded-xl text-on-surface-variant hover:text-secondary hover:bg-surface-container-high transition-all flex items-center justify-center"
              title="Notifikasi"
            >
              <span class="material-symbols-outlined text-[24px]"
                >notifications</span
              >
              <span
                class="absolute top-2 right-2 w-2 h-2 rounded-full bg-secondary animate-pulse"
              ></span>
            </a>
          </div>

          <div data-account-profile hidden>
            <div
              style="
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 10px;
                border: 1px solid currentColor;
                border-radius: 12px;
              "
            >
              <strong
                data-profile-avatar
                style="
                  background: #2563eb;
                  color: white;
                  border-radius: 8px;
                  padding: 7px;
                  font-size: 12px;
                "
                aria-hidden="true"
              ></strong>
              <span style="display: flex; flex-direction: column">
                <span data-profile-email style="font-size: 12px"></span>
                <small data-profile-role></small>
              </span>
            </div>
          </div>

          <button
            type="button"
            data-landing-logout
            title="Keluar Akun"
            aria-label="Keluar Akun"
            class="p-2 rounded-xl text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 border border-white/5 hover:border-rose-500/20 transition-all flex items-center justify-center"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.8"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN CONTENT AREA -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div class="flex flex-col gap-6">
        <!-- Header Judul -->
        <div
          class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4"
        >
          <div>
            <h1
              class="font-heading font-extrabold text-2xl sm:text-3xl text-white tracking-tight"
            >
              Pesanan Saya
            </h1>
            <p class="text-xs sm:text-sm text-bengkelin-muted mt-1">
              Pantau status pengerjaan kendaraan secara real-time & riwayat
              perawatan.
            </p>
          </div>
        </div>

        <!-- TAB NAVIGATION SWITCHER -->
        <div class="flex border-b border-white/10 gap-2 sm:gap-6">
          <button
            id="tab-btn-active"
            onclick="switchTab('active')"
            type="button"
            class="pb-3 px-2 font-heading text-sm font-semibold text-bengkelin-cyan border-b-2 border-bengkelin-cyan flex items-center gap-2 transition-all cursor-pointer focus:outline-none"
          >
            <span class="material-symbols-outlined text-[20px]">build</span>
            <span>Pesanan Berlangsung</span>
            <span
              id="ordersActiveCount"
              class="ml-1 px-2 py-0.5 text-xs rounded-full bg-white/5 text-bengkelin-muted border border-white/10"
              >0</span
            >
          </button>

          <button
            id="tab-btn-history"
            onclick="switchTab('history')"
            type="button"
            class="pb-3 px-2 font-heading text-sm font-medium text-bengkelin-muted hover:text-white border-b-2 border-transparent flex items-center gap-2 transition-all cursor-pointer focus:outline-none"
          >
            <span class="material-symbols-outlined text-[20px]">history</span>
            <span>Riwayat Pesanan</span>
            <span
              id="ordersHistoryCount"
              class="ml-1 px-2 py-0.5 text-xs rounded-full bg-bengkelin-cyan/10 text-bengkelin-cyan border border-bengkelin-cyan/20"
              >0</span
            >
          </button>
        </div>

        <!-- Pesan status aksi (diisi commerce-ui.js) -->
        <p
          id="featureMessage"
          role="status"
          aria-live="polite"
          class="text-sm text-bengkelin-amber empty:hidden"
        ></p>

        <!-- TAB CONTENT 1: PESANAN BERLANGSUNG (waiting / accepted / processing) -->
        <section id="content-active" class="space-y-4">
          <div id="ordersActive" class="space-y-4">
            <p class="text-sm text-bengkelin-muted">Memuat pesanan…</p>
          </div>
        </section>

        <!-- TAB CONTENT 2: RIWAYAT PESANAN (completed / cancelled) -->
        <section id="content-history" class="space-y-4 hidden">
          <div id="ordersHistory" class="space-y-4"></div>
        </section>

        <!-- Template empty state, di-clone oleh commerce-ui.js -->
        <template id="ordersEmptyActive">
          <div
            class="rounded-2xl bg-bengkelin-card border border-white/10 p-8 sm:p-12 text-center flex flex-col items-center justify-center gap-4 shadow-xl"
          >
            <div
              class="w-16 h-16 rounded-2xl bg-bengkelin-cyan/10 text-bengkelin-cyan flex items-center justify-center border border-bengkelin-cyan/20"
            >
              <span class="material-symbols-outlined text-[36px]"
                >no_crash</span
              >
            </div>
            <div class="max-w-md">
              <h2 class="font-heading font-bold text-white text-lg sm:text-xl">
                Belum ada pesanan berlangsung
              </h2>
              <p
                class="text-xs sm:text-sm text-bengkelin-muted mt-1.5 leading-relaxed"
              >
                Saat ini kendaraan kamu tidak sedang dalam pengerjaan servis
                atau reservasi aktif di bengkel mana pun.
              </p>
            </div>
            <a
              href="/search.html"
              class="mt-2 h-11 px-6 rounded-xl bg-bengkelin-cyan text-bengkelin-navy font-heading font-bold text-xs flex items-center justify-center gap-2 hover:opacity-90 transition-all shadow-lg shadow-cyan-500/10"
            >
              <span class="material-symbols-outlined text-[18px]">search</span>
              <span>Cari Bengkel Sekarang</span>
            </a>
          </div>
        </template>
        <template id="ordersEmptyHistory">
          <div
            class="rounded-2xl bg-bengkelin-card border border-white/10 p-8 text-center flex flex-col items-center gap-3 shadow-lg"
          >
            <span
              class="material-symbols-outlined text-[32px] text-bengkelin-muted"
              >history</span
            >
            <p class="text-sm text-bengkelin-muted">
              Belum ada pesanan yang selesai atau dibatalkan.
            </p>
          </div>
        </template>
      </div>
    </main>

    <!-- TAB SWITCHER SCRIPT -->
    <script>
      function switchTab(tabName) {
        const btnActive = document.getElementById("tab-btn-active");
        const btnHistory = document.getElementById("tab-btn-history");
        const contentActive = document.getElementById("content-active");
        const contentHistory = document.getElementById("content-history");

        if (tabName === "active") {
          // Style Tombol Active
          btnActive.className =
            "pb-3 px-2 font-heading text-sm font-semibold text-bengkelin-cyan border-b-2 border-bengkelin-cyan flex items-center gap-2 transition-all cursor-pointer focus:outline-none";
          btnHistory.className =
            "pb-3 px-2 font-heading text-sm font-medium text-bengkelin-muted hover:text-white border-b-2 border-transparent flex items-center gap-2 transition-all cursor-pointer focus:outline-none";

          // Tampilkan Konten Active
          contentActive.classList.remove("hidden");
          contentHistory.classList.add("hidden");
        } else {
          // Style Tombol History
          btnHistory.className =
            "pb-3 px-2 font-heading text-sm font-semibold text-bengkelin-cyan border-b-2 border-bengkelin-cyan flex items-center gap-2 transition-all cursor-pointer focus:outline-none";
          btnActive.className =
            "pb-3 px-2 font-heading text-sm font-medium text-bengkelin-muted hover:text-white border-b-2 border-transparent flex items-center gap-2 transition-all cursor-pointer focus:outline-none";

          // Tampilkan Konten History
          contentHistory.classList.remove("hidden");
          contentActive.classList.add("hidden");
        }
      }
    </script>

    <script src="/app.js"></script>
    <script src="/commerce-ui.js"></script>
    <script src="/notifications.js"></script>
  </body>
</html>
